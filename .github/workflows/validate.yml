name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Format errors:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build
        run: |
          go build -o x11-sleep-manager ./cmd/x11-sleep-manager
          go build -o x11smctl ./cmd/x11smctl

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Nix package
        run: nix-build default.nix --argstr version dev
